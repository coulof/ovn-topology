name: Go CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'api/**'
      - 'hack/**'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/go.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'api/**'
      - 'hack/**'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/go.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          skip-cache: true

      - name: Verify codegen
        run: |
          make generate
          # Verify openapi codegen is clean (OVSDB modelgen validation tags vary across darwin/linux math.MaxInt)
          git diff --exit-code pkg/api

      - name: Run Linters
        run: make lint

      - name: Run Tests
        run: make test

      - name: Build Binaries
        run: make build
